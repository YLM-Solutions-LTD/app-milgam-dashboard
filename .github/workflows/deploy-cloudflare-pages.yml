name: Deploy Cloudflare Pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate public site
        run: test -f site/index.html
      - name: Stamp release footer
        env:
          SIMPLYVIBE_RELEASE_ENVIRONMENT: preview
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';

          // Trusted workflow code. Never execute a script supplied by the generated app.
          export function stampRelease({ root = process.cwd(), environment = process.env.SIMPLYVIBE_RELEASE_ENVIRONMENT, now = new Date() } = {}) {
            if (!['preview', 'production'].includes(environment)) throw new Error('Release environment must be preview or production.');
            const git = (...args) => execFileSync('git', args, { cwd: root, encoding: 'utf8' }).trim();
            const commit = git('rev-parse', 'HEAD');
            const updated = git('log', '-1', '--format=%cI', '--', 'site');
            if (!/^[a-f0-9]{40}$/.test(commit) || !updated || !Number.isFinite(Date.parse(updated))) throw new Error('Release source metadata is unavailable.');
            const metadata = {
              schemaVersion: 1,
              version: commit.slice(0, 12),
              commit,
              environment,
              updatedAt: new Date(updated).toISOString(),
              // The publication timestamp is frozen in this artifact, never the viewer's clock.
              releasedAt: environment === 'production' ? now.toISOString() : null
            };
            const files = [];
            const visit = directory => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                if (entry.isSymbolicLink()) throw new Error('Symbolic links are not allowed in the public artifact.');
                const file = path.join(directory, entry.name);
                if (entry.isDirectory()) {
                  if (!['node_modules', '.git', '.agents'].includes(entry.name)) visit(file);
                } else if (entry.name.endsWith('.html')) files.push(file);
              }
            };
            visit(path.join(root, 'site'));
            const marker = /<footer\b(?=[^>]*\bdata-simplyvibe-release(?:\s|=|>))[^>]*>/gi;
            const updates = [];
            for (const file of files) {
              const html = fs.readFileSync(file, 'utf8');
              const matches = [...html.matchAll(marker)];
              if (path.basename(file) === 'index.html' && matches.length !== 1) throw new Error('Each app index.html must contain exactly one release footer.');
              if (!matches.length) continue;
              const stamped = html.replace(marker, tag => {
                const clean = tag.replace(/\sdata-release-(?:version|updated-at|released-at|environment)\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '');
                return clean.slice(0, -1) + ` data-release-version="${metadata.version}" data-release-updated-at="${metadata.updatedAt}" data-release-released-at="${metadata.releasedAt ?? ''}" data-release-environment="${environment}">`;
              });
              updates.push([file, stamped]);
            }
            if (!files.includes(path.join(root, 'site', 'index.html'))) throw new Error('Missing site/index.html.');
            for (const [file, html] of updates) fs.writeFileSync(file, html);
            fs.writeFileSync(path.join(root, 'site', 'release.json'), JSON.stringify(metadata, null, 2) + '\n');
            return metadata;
          }

          if (process.env.SIMPLYVIBE_RELEASE_ENVIRONMENT !== undefined) stampRelease();
          NODE
      - name: Deploy PR preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=pr-${{ github.event.pull_request.number }} --commit-hash=${{ github.event.pull_request.head.sha }}

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate public site
        run: test -f site/index.html
      - name: Stamp release footer
        env:
          SIMPLYVIBE_RELEASE_ENVIRONMENT: production
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';

          // Trusted workflow code. Never execute a script supplied by the generated app.
          export function stampRelease({ root = process.cwd(), environment = process.env.SIMPLYVIBE_RELEASE_ENVIRONMENT, now = new Date() } = {}) {
            if (!['preview', 'production'].includes(environment)) throw new Error('Release environment must be preview or production.');
            const git = (...args) => execFileSync('git', args, { cwd: root, encoding: 'utf8' }).trim();
            const commit = git('rev-parse', 'HEAD');
            const updated = git('log', '-1', '--format=%cI', '--', 'site');
            if (!/^[a-f0-9]{40}$/.test(commit) || !updated || !Number.isFinite(Date.parse(updated))) throw new Error('Release source metadata is unavailable.');
            const metadata = {
              schemaVersion: 1,
              version: commit.slice(0, 12),
              commit,
              environment,
              updatedAt: new Date(updated).toISOString(),
              // The publication timestamp is frozen in this artifact, never the viewer's clock.
              releasedAt: environment === 'production' ? now.toISOString() : null
            };
            const files = [];
            const visit = directory => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                if (entry.isSymbolicLink()) throw new Error('Symbolic links are not allowed in the public artifact.');
                const file = path.join(directory, entry.name);
                if (entry.isDirectory()) {
                  if (!['node_modules', '.git', '.agents'].includes(entry.name)) visit(file);
                } else if (entry.name.endsWith('.html')) files.push(file);
              }
            };
            visit(path.join(root, 'site'));
            const marker = /<footer\b(?=[^>]*\bdata-simplyvibe-release(?:\s|=|>))[^>]*>/gi;
            const updates = [];
            for (const file of files) {
              const html = fs.readFileSync(file, 'utf8');
              const matches = [...html.matchAll(marker)];
              if (path.basename(file) === 'index.html' && matches.length !== 1) throw new Error('Each app index.html must contain exactly one release footer.');
              if (!matches.length) continue;
              const stamped = html.replace(marker, tag => {
                const clean = tag.replace(/\sdata-release-(?:version|updated-at|released-at|environment)\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '');
                return clean.slice(0, -1) + ` data-release-version="${metadata.version}" data-release-updated-at="${metadata.updatedAt}" data-release-released-at="${metadata.releasedAt ?? ''}" data-release-environment="${environment}">`;
              });
              updates.push([file, stamped]);
            }
            if (!files.includes(path.join(root, 'site', 'index.html'))) throw new Error('Missing site/index.html.');
            for (const [file, html] of updates) fs.writeFileSync(file, html);
            fs.writeFileSync(path.join(root, 'site', 'release.json'), JSON.stringify(metadata, null, 2) + '\n');
            return metadata;
          }

          if (process.env.SIMPLYVIBE_RELEASE_ENVIRONMENT !== undefined) stampRelease();
          NODE
      - name: Deploy production to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=main --commit-hash=${{ github.sha }}